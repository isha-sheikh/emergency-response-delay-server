<!DOCTYPE html>
<html>

<head>
    <title>SwiftResponse Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 300px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            z-index: 1000;
        }

        #map {
            flex-grow: 1;
            height: 100%;
        }

        .sos-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .sos-btn:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <h2>Emergency Solver</h2>
        <button class="sos-btn" id="sos-trigger">BROADCAST SOS</button>
        <div id="status-feed">
            <p>Ready for dispatch...</p>
        </div>
    </div>
    <div id="map"></div>

    <script>
        const socket = io();
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let userMarker;

        // 1. Send SOS with actual GPS
        document.getElementById('sos-trigger').onclick = () => {
            navigator.geolocation.getCurrentPosition((pos) => {
                const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                socket.emit('sos-signal', coords);
                map.setView([coords.lat, coords.lng], 15);
            });
        };

        // 2. Receive SOS and mark it on the Map
        socket.on('volunteer-alert', (data) => {
            const feed = document.getElementById('status-feed');
            feed.innerHTML = `<div style="background:red; padding:10px; margin-top:10px;">⚠️ INCOMING EMERGENCY</div>` + feed.innerHTML;

            L.circle([data.lat, data.lng], { color: 'red', fillColor: '#f03', fillOpacity: 0.5, radius: 500 }).addTo(map);
            L.marker([data.lat, data.lng]).addTo(map).bindPopup("<b>Victim Location</b>").openPopup();
        });
    </script>
</body>

</html>
